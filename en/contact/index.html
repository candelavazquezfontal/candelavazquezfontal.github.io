<style>
/* Concepto: web como albarán de transporte. Cada sección es una hoja aparte; filas de manifiesto con fechas, códigos y separadores punteados tipo perforación. */
:root{
  --bg:#F5F5FB; --surface:#FFFFFF; --fg:#16183A; --muted:#5B5F85; --line:#D6D9EE;
  --accent:#3B47C4; --accent-soft:#E0E3FF; --on-accent:#FFFFFF;
  --ok:#1F7A4D; --ok-soft:#DDF3E7; --wip:#8A5200; --wip-soft:#FFEFD0;
  --f-display:'Bricolage Grotesque','Helvetica Neue',Arial,sans-serif;
  --f-body:'IBM Plex Sans','Helvetica Neue',Arial,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1024; --surface:#161939; --fg:#E9EAF8; --muted:#9A9EC6; --line:#2B2F5E;
  --accent:#A3ADFF; --accent-soft:#252A66; --on-accent:#0E1024;
  --ok:#7ADCA6; --ok-soft:#173D2C; --wip:#FFC76B; --wip-soft:#46310E; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1024; --surface:#161939; --fg:#E9EAF8; --muted:#9A9EC6; --line:#2B2F5E;
  --accent:#A3ADFF; --accent-soft:#252A66; --on-accent:#0E1024;
  --ok:#7ADCA6; --ok-soft:#173D2C; --wip:#FFC76B; --wip-soft:#46310E; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:16px/1.6 var(--f-body);padding-inline:20px}
.wrap{max-width:980px;margin-inline:auto}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:3px}
.mono{font-family:var(--f-mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0}

/* Navegación por secciones */
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px dashed var(--line);margin-inline:-20px;padding:10px 20px}
nav .wrap{display:flex;gap:8px 18px;align-items:center;flex-wrap:wrap;justify-content:space-between}
nav b{font-family:var(--f-display);font-size:17px}
nav ul{display:flex;gap:4px;list-style:none;margin:0;padding:0;flex-wrap:wrap}
nav a{display:block;color:var(--fg);text-decoration:none;font-size:14px;padding:5px 11px;border-radius:999px;border:1px solid transparent}
nav a:hover{border-color:var(--line)}
nav a[aria-current="page"]{background:var(--accent);color:var(--on-accent)}

.view{padding-block:40px 56px}
.view-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:26px}
.view-head h2{font-size:clamp(32px,6vw,54px);font-weight:800;letter-spacing:-.02em;line-height:1}
.view h3.sub{font-size:22px;font-weight:700;margin:36px 0 12px}
.view h3.sub:first-of-type{margin-top:0}

/* Inicio */
.hero{display:grid;grid-template-columns:1.5fr 1fr;gap:40px;align-items:start;padding-block:16px 40px}
.hero h1{font-size:clamp(40px,7vw,76px);line-height:.98;font-weight:800;letter-spacing:-.02em}
.hero h1 span{color:var(--accent)}
.hero p.lead{font-size:18px;max-width:52ch;color:var(--muted);margin:20px 0 0}
.cta{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}
.btn{font:500 14px var(--f-body);padding:10px 16px;border-radius:6px;border:1px solid var(--accent);background:var(--accent);color:var(--on-accent);text-decoration:none;cursor:pointer}
.btn.ghost{background:transparent;color:var(--accent)}
.label{background:var(--surface);border:1px dashed var(--line);border-radius:10px;padding:18px;min-width:0}
.label dl{margin:12px 0 0;display:grid;grid-template-columns:auto 1fr;gap:8px 14px;font-size:14px}
.label dt{font-family:var(--f-mono);font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding-top:2px}
.label dd{margin:0;min-width:0;overflow-wrap:anywhere}
.about{display:grid;grid-template-columns:1.2fr 1fr;gap:32px;padding-block:36px;border-top:1px dashed var(--line)}
.about p{margin:0 0 12px;max-width:60ch}
.about .side{display:grid;gap:18px;align-content:start;min-width:0}
.about .side p{margin:0 0 8px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:0;padding:0;list-style:none}
.chips li,.chip{font:500 13px var(--f-body);padding:5px 11px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--fg)}
button.chip{cursor:pointer}
button.chip span{color:var(--muted);font-family:var(--f-mono);font-size:11px;margin-left:5px}
button.chip[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
button.chip[aria-pressed="true"] span{color:var(--on-accent)}
.seek{padding-block:32px;border-top:1px dashed var(--line)}
.seek p:not(.mono){margin:6px 0 14px;max-width:62ch;font-size:17px}
.doors{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--fg)}
.doors a{display:block;padding:18px 18px 18px 0;text-decoration:none;color:var(--fg);border-bottom:1px dashed var(--line)}
.doors a+a{padding-left:18px;border-left:1px dashed var(--line)}
.doors b{display:block;font:700 22px var(--f-display);margin-top:6px}
.doors span.go{color:var(--accent);font-size:14px}
.doors a:hover b{color:var(--accent)}

/* Listas tipo manifiesto */
.tl{list-style:none;margin:0;padding:0;border-top:1px solid var(--fg)}
.tl>li{display:grid;grid-template-columns:170px 1fr;gap:6px 24px;padding-block:16px;border-bottom:1px dashed var(--line)}
.tl h4{font:700 19px var(--f-display);margin:0}
.tl .org{color:var(--muted);font-size:14px}
.tl p{margin:6px 0 0;font-size:15px;max-width:64ch}
.tl ul.pts{margin:6px 0 0;padding-left:18px;font-size:15px;max-width:64ch}
.tl .chips{margin-top:10px}
.tl .chips li{font-size:12px;padding:3px 9px}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.tools .lab{flex:0 0 auto;margin-right:4px}
.field{font:400 14px var(--f-body);padding:7px 11px;border-radius:6px;border:1px solid var(--line);background:var(--surface);color:var(--fg);min-width:0;max-width:100%}
input.field{flex:1 1 200px;max-width:320px}
.count{display:block;margin:0 0 8px}
.rows{border-top:1px solid var(--fg)}
.row{display:grid;grid-template-columns:120px 1fr auto;gap:6px 20px;padding:13px 0;border-bottom:1px dashed var(--line);align-items:baseline}
.row h3{font-size:17px;font-weight:700}
.row .meta{color:var(--muted);font-size:14px;margin-top:2px}
.row .go{font-size:13px;white-space:nowrap}
.row .go .id{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.empty{color:var(--muted);padding:16px 0;margin:0}
#proj-list{border-top:1px solid var(--fg)}
details.proj{border-bottom:1px dashed var(--line)}
details.proj summary{display:grid;grid-template-columns:120px 1fr auto;gap:6px 20px;padding:16px 0;cursor:pointer;list-style:none;align-items:baseline}
details.proj summary::-webkit-details-marker{display:none}
details.proj summary h3{font-size:20px;font-weight:700}
details.proj summary .meta{color:var(--muted);font-size:14px}
details.proj summary .plus{font-family:var(--f-mono);color:var(--accent);font-size:20px;line-height:1;display:inline-block}
details.proj[open] .plus{transform:rotate(45deg)}
.proj-body{display:grid;grid-template-columns:120px 1fr;gap:0 20px;padding:0 0 22px}
.proj-body .in{grid-column:2;display:grid;grid-template-columns:1fr 1fr;gap:18px 28px;min-width:0}
.proj-body h4{font:500 11px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 0 4px}
.proj-body p{margin:0;font-size:15px;max-width:66ch}
.proj-body ul{margin:0;padding-left:18px;font-size:15px}
.proj-body .wide{grid-column:1/-1}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tags span{font-size:12px;padding:2px 9px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.honor{display:inline-block;font:500 11px var(--f-mono);letter-spacing:.05em;text-transform:uppercase;padding:3px 8px;border-radius:4px;background:var(--ok-soft);color:var(--ok)}
.draft{background:var(--wip-soft);color:var(--fg);border-left:3px solid var(--wip);padding:10px 12px;font-size:14px}
.draft b{font:500 11px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--wip);display:block;margin-bottom:2px}
p.draft{margin:18px 0 0}
body.clean .draft{display:none}
footer{padding-block:28px 48px;border-top:1px dashed var(--line);display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;color:var(--muted);font-size:14px}
footer button{font:500 13px var(--f-body);padding:6px 12px;border-radius:6px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer}
@media (max-width:760px){
  .hero,.about{grid-template-columns:1fr}
  .hero{gap:28px;padding-block:8px 32px}
  .doors{grid-template-columns:1fr}
  .doors a+a{padding-left:0;border-left:0}
  .tl>li{grid-template-columns:1fr}
  .row,details.proj summary{grid-template-columns:1fr auto}
  .row>:first-child,details.proj summary>:first-child{grid-column:1/-1}
  .row>div{grid-column:1/-1}
  .row .go{grid-column:1/-1;white-space:normal}
  .proj-body{grid-template-columns:1fr}
  .proj-body .in{grid-column:1;grid-template-columns:1fr}
}
.langsw{display:flex;gap:2px;align-items:center;font:500 13px var(--f-mono);letter-spacing:.04em}
.langsw a,.langsw span{padding:4px 9px;border-radius:999px;border:1px solid transparent;text-decoration:none;color:var(--muted)}
.langsw a:hover{border-color:var(--line);color:var(--fg)}
.langsw span[aria-current="true"]{background:var(--accent);color:var(--on-accent)}
nav .wrap .navr{display:flex;gap:10px 14px;align-items:center;flex-wrap:wrap}
.note-sm{color:var(--muted);font-size:14px;max-width:62ch}
@media (max-width:760px){
  nav .wrap .navr{display:contents}
  nav .wrap>a{order:1}
  nav .wrap .langsw{order:2;margin-left:auto}
  nav .wrap .navr ul{order:3;flex-basis:100%}
}

</style>
</head>
<body>
<nav aria-label="Sections"><div class="wrap"><a href="/en/" style="text-decoration:none;color:inherit"><b>C. Vázquez Fontal</b></a><div class="navr"><ul><li><a href="/en/">Home</a></li><li><a href="/en/experience/">Experience</a></li><li><a href="/en/projects/">Projects</a></li><li><a href="/en/certifications/">Certifications</a></li><li><a href="/en/contact/" aria-current="page">Contact</a></li></ul><div class="langsw" role="group" aria-label="Language"><a href="/contacto/" hreflang="es" lang="es" data-setlang="es">ES</a><span aria-current="true" lang="en">EN</span></div></div></div></nav>
<main class="wrap">
<section class="view" id="v-contacto">
  <div class="view-head"><h1 style="font-size:clamp(32px,6vw,54px);font-weight:800;letter-spacing:-.02em;line-height:1">Contact</h1><span class="mono">Get in touch</span></div>
  <p style="margin:0 0 18px;max-width:56ch">I&#x27;m open to conversations about operations, logistics and data-driven improvement projects.</p>
  <div class="cta" style="margin-top:0">
    <button class="btn" id="copy-mail" type="button">Copy email</button>
    <a class="btn ghost" href="https://www.linkedin.com/in/candela-v%C3%A1zquez-fontal" target="_blank" rel="noopener">LinkedIn</a>
  </div>
  <p style="margin:14px 0 0">Email: <span id="mail" style="user-select:all">candelavfontal@gmail.com</span></p>
</section>
</main>
<div class="wrap"><footer><span>Candela Vázquez Fontal · 2026</span><a href="https://www.linkedin.com/in/candela-v%C3%A1zquez-fontal" target="_blank" rel="noopener">LinkedIn</a></footer></div>
<script>
try{document.querySelectorAll("[data-setlang]").forEach(function(a){a.addEventListener("click",function(){localStorage.setItem("lang",a.dataset.setlang)})})}catch(_){}
document.getElementById("copy-mail").onclick=async function(ev){
  var b=ev.currentTarget,txt=document.getElementById("mail").textContent;
  try{await navigator.clipboard.writeText(txt);b.textContent="Email copied"}
  catch(_){var r=document.createRange();r.selectNodeContents(document.getElementById("mail"));var s=getSelection();s.removeAllRanges();s.addRange(r);b.textContent="Select and copy"}
  setTimeout(function(){b.textContent="Copy email"},2200);
};
</script>
